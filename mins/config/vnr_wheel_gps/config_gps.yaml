%YAML:1.0 # need to specify the file type at the top!

# u-blox fixes from prior_map_localization gps_cov_floor. The KAIST noise and gating, not tuned here.
# overwrite_noise keeps the fixed noise. With false MINS takes the square root of the NavSatFix
# variances and multiplies it by noise_scale; that path has not been tried on our bags.
gps:
  enabled: true
  max_n: 1
  do_calib_ext: false
  do_calib_dt: false
  init_distance: 20.0
  init_closed_form: true
  init_cov_dt: 1e-3
  init_cov_ex: 1e-1
  init_cov_inflation: 2.0
  chi2_mult: 9999
  overwrite_noise: true
  noise: 3.0

gps0:
  timeoffset: 0.0
  # gnss_antenna in vectornav from hunter2_description (axes right-forward-up).
  pGinI: [0.0, -0.12125, 0.12645]
  topic: "/gps/fix_floored"
